services:
  backend:
    build: ./backend
    volumes:
      # Backend code and media
      - ./backend:/code
      - ./backend/media:/code/media

      # ML code and workspace
      - ./ml:/workspace

      # Dataset for training/inference
      -  ./data:/workspace/data 

      # Saved models and outputs
      - ./ml/saved_models:/workspace/saved_models
      - ./ml/tfjs_model_output:/workspace/tfjs_model_output

      # Optional: classes.json if needed in backend
      - ./ml/classes.json:/workspace/classes.json

    environment:
      - DJANGO_SETTINGS_MODULE=project.settings
      - PYTHONUNBUFFERED=1
      - POSTGRES_DB=tobaccodb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MODEL_KERAS_PATH=/workspace/saved_models/saved_model
      - MODEL_TFLITE_PATH=
      - MODEL_CLASSES_TXT=/workspace/classes.txt
      - DEBUG=1
      - MLSERVE_URL=http://mlserve:8000/infer
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,10.0.2.2
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mlserve
    command: ["./entrypoint.sh"]

  web:
    build: ./web-admin
    volumes:
      - ./web-admin:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true

  ml:
    build: ./ml
    volumes:
      - ./ml:/workspace
      - ./data/roboflow_tobacco:/workspace/data/roboflow_tobacco
      - ./data/tobacco_processed:/workspace/data/tobacco_processed
      - ./ml/saved_models:/workspace/saved_models
      - ./ml/tfjs_model_output:/workspace/tfjs_model_output
    command: ["bash"]
    ports:
      - "8888:8888"

  # mlserve: use the patched image (no rebuild of TF)
  mlserve:
    image: tobacco_leaf_disease_tooling-ml:patched
    volumes:
      - ./ml:/workspace
      - ./ml/saved_models:/workspace/saved_models
      - ./ml/classes.json:/workspace/classes.json
      - ./data/tobacco_processed:/workspace/data/tobacco_processed  # <--- added dataset mount
    environment:
      - ML_MODEL_PATH=/workspace/saved_models/saved_model
      - ML_CLASSES_JSON=/workspace/classes.json
      - ML_IMG_SIZE=224
    ports:
      - "8001:8000"
    command: ["uvicorn", "serve:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - ml

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tobaccodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data:
